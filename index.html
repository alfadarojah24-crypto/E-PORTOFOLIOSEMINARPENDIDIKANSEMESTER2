<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Portofolio Refleksi LK 2 · Nurudlucha Alfa Darojah</title>
<style>
:root{--navy:#0d2b45;--navy2:#143a5c;--or:#e0701a;--bg:#f4f6f8;--sf:#fff;--tx:#17232d;--mu:#5a6b78;--bd:#cfd8df;--mono:Consolas,Menlo,"Courier New",monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;font:16px/1.7 var(--sans);color:var(--tx);background:var(--bg) linear-gradient(var(--bd) 1px,transparent 1px) 0 0/40px 40px;background-blend-mode:multiply}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
a{color:#0b5f93}
.top{position:sticky;top:0;z-index:9;background:var(--navy);color:#fff;border-bottom:3px solid var(--or)}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:0 14px}
.brand{display:flex;gap:8px;align-items:center;color:#fff;text-decoration:none;font-weight:700;white-space:nowrap;padding:12px 0}
nav{display:flex;overflow-x:auto;gap:2px}
nav a{color:#c9d8e4;text-decoration:none;padding:14px 11px;font-size:.88rem;white-space:nowrap}
nav a:hover,nav a[aria-current]{color:#fff;box-shadow:inset 0 -3px var(--or)}
.hero{background:var(--navy) linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/28px 28px;color:#fff;padding:48px 0 40px;border-bottom:1px solid #000}
.hero.sm{padding:30px 0 26px}
.hero h1{font-size:clamp(1.5rem,4.5vw,2.3rem);line-height:1.25;margin:6px 0 14px}
.hero .lead{color:#d7e3ec;margin:0 0 8px}.small{font-size:.85rem;color:var(--mu)}.hero .small{color:#9fb4c4}
.mono{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;color:var(--or);margin:0}
.hero .mono{color:#f5a561}
main{padding:28px 18px 50px}
h2{font-size:1.3rem;margin:34px 0 10px;padding-left:12px;border-left:5px solid var(--or)}
h3{margin:0 0 6px;font-size:1.02rem;color:var(--navy)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:16px;border-top:3px solid var(--navy2)}
.card p{margin:4px 0}.empty{border-top-color:var(--or);text-align:center;padding:30px}
.dwg{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin:22px 0}.dwg.one{grid-template-columns:1fr}
.dwg>div{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:18px}
.dwg p{margin:8px 0 0}.dwg ul{margin:8px 0 0;padding-left:20px}
.chip{display:inline-block;font:700 .7rem var(--mono);letter-spacing:.1em;background:var(--navy);color:#fff;padding:3px 9px;border-radius:3px}.chip.o{background:var(--or)}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--navy2)}
.tl li{position:relative;padding:0 0 20px 14px}.tl li:before{content:"";position:absolute;left:-31px;top:6px;width:14px;height:14px;background:var(--or);border:3px solid var(--bg);border-radius:50%}
.tl li.off:before{background:#9aa8b3}.tl p{margin:2px 0}.tl h3{margin:2px 0}
.btn{display:inline-block;background:var(--sf);color:var(--navy);border:1px solid var(--navy2);padding:5px 12px;border-radius:4px;font-size:.85rem;text-decoration:none;margin:2px 4px 2px 0}
.btn:hover{background:var(--navy);color:#fff}.btn.pri{background:var(--or);border-color:var(--or);color:#fff;font-weight:600;padding:8px 16px}
.slot{display:inline-block;border:1px dashed #98a7b3;color:var(--mu);padding:4px 10px;border-radius:4px;font-size:.82rem;margin:2px 4px 2px 0}
.art dl{margin:10px 0 0}.art dt{font:700 .72rem var(--mono);letter-spacing:.08em;color:var(--or);text-transform:uppercase;margin-top:10px}.art dd{margin:2px 0 0}
.files{margin:8px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px;background:var(--sf)}
th,td{border:1px solid var(--bd);padding:10px;text-align:left;vertical-align:top;font-size:.92rem}th{background:var(--navy);color:#fff;font-size:.8rem}
.dl{list-style:none;padding:0}
.pn{display:flex;justify-content:space-between;margin-top:36px;gap:10px}.pn a{padding:10px 16px;background:var(--navy);color:#fff;text-decoration:none;border-radius:4px;font-size:.9rem}
footer{background:var(--navy);color:#b7c8d6;text-align:center;padding:18px 0;font-size:.85rem}
code{background:#e6ecf0;padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:.85em}
@media(max-width:720px){.dwg{grid-template-columns:1fr}.bar{flex-direction:column;align-items:flex-start;gap:0}.brand{padding:10px 0 0}}
@media print{.top,.pn{display:none}}

.split{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.ill{width:100%;max-width:460px;justify-self:end;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:1px solid #2c5a80}.ill.sm{max-width:300px}
.tl li{display:flex;gap:14px;align-items:center}.tl .th{width:112px;border-radius:6px;flex:none;border:1px solid var(--bd)}
.cover{width:100%;display:block;border:1px solid var(--bd);margin-bottom:10px}.docs{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
details{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:12px 16px}summary{cursor:pointer;font-weight:600;color:var(--navy)}
iframe{width:100%;height:640px;border:1px solid var(--bd);margin-top:12px;background:#fff}
@media(max-width:720px){.split{grid-template-columns:1fr}.ill{justify-self:start;max-width:100%}.tl li{flex-direction:column;align-items:flex-start}.tl .th{width:100%;max-width:220px}iframe{height:420px}}
</style></head>

 challenge: "Topik Ruang Kolaborasi menyajikan studi kasus konflik kepentingan, perlakuan diskriminatif terhadap siswa berdasarkan kemampuan, dan pelanggaran etika profesional. Dari kasus-kasus itu saya menyadari bahwa profesionalisme tidak cukup diukur dari presensi dan beban mengajar. Ukurannya juga menjaga martabat profesi dan memperlakukan siswa secara adil, di kelas maupun di bengkel.",
 concept: [["Kepribadian", "Ucapan sejalan dengan tindakan, terutama pada aturan K3 dan kedisiplinan bengkel."], ["Sosial", "Komunikasi yang tidak membedakan latar belakang atau kecepatan belajar siswa, orang tua, dan rekan sejawat."], ["Pedagogik", "Setiap siswa berhak belajar dan merasa aman, secara fisik maupun emosional."], ["Profesional", "Memperbarui ilmu dan keterampilan mengikuti perkembangan teknologi."]],
 change: ["Menjadi pendidik yang berpegang pada kode etik, bukan hanya pengajar keterampilan teknis.", "Menunjukkan keteladanan lewat kerapian, ketepatan waktu, kejujuran dalam penilaian, dan tutur kata yang santun."],
 art: [{k: "studiKasus", alasan: "Menunjukkan kemampuan saya mengenali pelanggaran etika dan menyusun penyelesaiannya dengan acuan empat prinsip profesionalisme.", bagian: "Bagian solusi: rekomendasi penyelesaian konflik melalui musyawarah dan keadilan bagi siswa (kompetensi sosial dan pedagogik)."},
       {k: "matriksAksi", alasan: "Memperlihatkan komitmen yang dirinci dalam langkah pengembangan keempat kompetensi secara berkala.", bagian: "Rencana aksi: target mengikuti pelatihan teknik terkini dan kebiasaan evaluasi diri harian (kompetensi profesional dan kepribadian)."}]},
{id: "pse", pert: "Pertemuan VIII", nama: "Pembelajaran Sosial Emosional", pendek: "PSE", lk: "dokumen/lk2/LK2-Pembelajaran-Sosial-Emosional.pdf",
 ringkas: "Teknik STOP dan tutorial bertahap untuk mengurangi kecemasan siswa di praktik CAD/CAM.",
 connection: "PSE memperkenalkan lima kompetensi sosial emosional menurut CASEL: kesadaran diri, manajemen diri, kesadaran sosial, keterampilan berelasi, dan pengambilan keputusan yang bertanggung jawab. Saya memilih pengalaman menerapkan teknik kesadaran penuh (Teknik STOP) dan pembelajaran berdiferensiasi emosional pada praktik CAD/CAM Mastercam X5, karena siswa sering cemas, minder, dan kelelahan mental saat membuat geometri, toolpath, simulasi contour/pocket, sampai mengolah NC Code sebelum program dikirim ke mesin CNC.",
 challenge: "Sebelumnya saya menilai keberhasilan praktik dari kecepatan menggambar dan ketepatan toolpath. Materi PSE membuat saya melihat bahwa kondisi emosional siswa ikut menentukan hasil itu. Praktik yang saya ubah: menyisipkan jeda Teknik STOP ketika simulasi menunjukkan error, dan menyediakan tutorial langkah demi langkah bagi siswa yang tempo belajarnya lebih lambat agar mereka tidak panik.",
 concept: [["Regulasi diri dan Teknik STOP", "Siswa berhenti sejenak ketika emosi meningkat akibat program yang gagal."], ["Pembelajaran berdiferensiasi emosional", "Bahan dan video mandiri menampung perbedaan kecepatan belajar dan mengurangi kecemasan akademik."], ["Pengambilan keputusan bertanggung jawab", "Ketelitian, pengecekan ganda G-Code, dan budaya K3 di laboratorium komputer dan bengkel CNC."], ["Keterampilan berelasi", "Tutor sebaya yang dijalankan dengan empati."]],
 change: ["Menyiapkan lingkungan belajar yang aman secara psikologis, bukan hanya mentransfer pengetahuan teknis.", "Membuat dan terus memperbaiki video tutorial untuk setiap materi praktik.", "Menambahkan asesmen diagnostik non-kognitif (emosional) serta latihan kesadaran penuh sebelum dan sesudah praktik mesin."],
 art: [{k: "modulAjar", alasan: "Menghubungkan teori PSE dari LMS dengan perencanaan nyata di SMKN 6 Malang; KSE terlihat direncanakan, tidak hanya disebut.", bagian: "Fase awal (orientasi berkesadaran: hening sejenak) dan fase penutup (evaluasi pengalaman: guru menanyakan perasaan siswa saat berhasil menggambar dan mengoperasikan program)."},
       {k: "video", alasan: "Wujud dukungan emosional dan diferensiasi yang saya rancang untuk siswa yang cemas atau tertinggal.", bagian: "Langkah bergambar pada Modul Job 2, 3, dan 11 (dari atur tampilan layar sampai toolpath) yang dapat diulang siswa; modul Job 11 dilengkapi tautan video per langkah."}]},
{id: "pma", pert: "Pertemuan IX", nama: "Pembelajaran Mendalam dan Asesmen Lanjut", pendek: "PMA", lk: "dokumen/lk2/LK2-Pembelajaran-Mendalam-dan-Asesmen-Lanjut.pdf",
 ringkas: "Asesmen sebagai penggerak pembelajaran, dengan rubrik dan panduan self-assessment.",
 connection: "Sebelum mengikuti mata kuliah ini, saya memandang asesmen sebagai alat ukur administratif di akhir pembelajaran. Materi LMS menggeser pandangan itu: asesmen perlu menjadi penggerak pembelajaran mendalam. Pada materi keilmuan yang kompleks, asesmen yang dirancang baik melatih penalaran kritis, sehingga alur belajar yang saya susun menuntut pemahaman konsep dan tidak berhenti pada hafalan.",
 challenge: "Kesulitan terbesar ada pada penyusunan instrumen. Menangkap metakognisi dan proses bernalar secara objektif ternyata sulit, terutama saat menulis rubrik performance-based assessment dan asesmen formatif yang harus melayani rentang kemampuan yang beragam. Saya juga menghadapi dilema kebiasaan menilai dengan angka cepat versus menulis umpan balik deskriptif yang memakan waktu tetapi lebih berguna bagi siswa.",
 concept: [["Assessment as Learning", "Siswa menilai proses belajarnya sendiri melalui self-assessment dan peer-assessment."], ["Assessment for Learning", "Umpan balik formatif yang konstruktif dan berkelanjutan, bukan sekadar centang atau angka, untuk menutup jarak antara kinerja saat ini dan tujuan belajar."], ["Deep Learning", "Pengalaman belajar yang menuntut analisis, pemecahan masalah otentik, dan sintesis antarkonsep agar pemahaman bertahan lama."]],
 change: ["Beralih dari berfokus pada penyampaian materi menjadi berfokus pada perkembangan cara berpikir siswa.", "Merancang asesmen sejak awal perencanaan (backwards design), bukan sebagai penutup alur pembelajaran.", "Menyediakan instrumen yang transparan dan inklusif."],
 art: [{k: "modulGT", alasan: "Contoh nyata asesmen yang saya rancang di PPL: asesmen awal (tes diagnostik), asesmen proses (jobsheet), dan asesmen akhir (rubrik), ditambah pengayaan dan remedial.", bagian: "Bagian Asesmen: tiga pertanyaan diagnostik, rubrik hasil gambar dengan empat kriteria berbobot (ketepatan proyeksi 40%, ukuran 30%, kualitas garis 15%, kerapian 15%)."},
       {k: "modulPMA", alasan: "Memperlihatkan bagaimana kerangka deep learning dari LMS saya terjemahkan menjadi skenario belajar bertahap yang terukur.", bagian: "Matriks asesmen diagnostik dan formatif: instrumen awal untuk memetakan kesiapan kognitif dan emosional siswa sebelum konsep yang berat dipelajari."},
       {k: "rubrik", alasan: "Menunjukkan penerapan asesmen kinerja pada praktik CAD/CAM: yang dinilai adalah tahapan kerja di perangkat lunak dan hasil verifikasi simulasi, tidak hanya gambar akhir.", bagian: "Rubrik penilaian: enam aspek (presisi gambar, stock setup, pemilihan pahat dan parameter, linking parameters, hasil simulasi 3D, G-Code) dengan skor maksimal 100; serta soal refleksi tentang arah kompensasi, tool collision, dan perbandingan dengan G-Code manual."}]},
{id: "ppl", pert: "Pertemuan X", nama: "Praktik Pengalaman Lapangan (PPL) Mandiri", pendek: "PPL Mandiri", lk: "dokumen/lk2/LK2-PPL-Mandiri.pdf",
 ringkas: "Mengelola laboratorium CAD/CAM dan mendampingi siswa dengan tempo belajar berbeda.",
 connection: "PPL Mandiri adalah tempat saya menerapkan teori mengajar dan keahlian teknis secara langsung: memimpin pembelajaran dan mengelola laboratorium di SMKN 6 Malang. Di kelas XI KK4, saya menerapkan Project-Based Learning pada mata pelajaran CAD/CAM Mastercam X5 sambil memperhatikan kondisi emosional siswa.",
 challenge: "Kebiasaan saya adalah mengajar satu arah dengan perhatian pada hasil akhir. Di laboratorium, tempo belajar siswa sangat beragam, dan siswa yang lambat memahami alur program mudah cemas dan merasa tertinggal. Saya menyusun bahan dan video tutorial Mastercam X5 yang bertahap agar mereka dapat belajar mandiri sesuai tempo masing-masing.",
 concept: [["Pengelolaan laboratorium vokasi", "Alur praktik yang tertib: teori, simulasi mandiri, lalu penerapan K3."], ["Diferensiasi media dan scaffolding", "Modul ajar dan video tutorial sebagai bantuan ketika program mengalami error."], ["Praktik reflektif berbasis bukti", "Evaluasi mengajar tiap hari berdasarkan respons siswa serta masukan Guru Pamong dan Dosen Pembimbing Lapangan."]],
 change: ["Dari pembelajaran berpusat pada guru menjadi berpusat pada siswa, dengan kepekaan pada kebutuhan tiap individu.", "Membuat media pembelajaran interaktif untuk setiap materi praktik agar siswa dapat belajar mandiri tanpa takut tertinggal."],
 art: [{k: "modulAjar", alasan: "Memperlihatkan alur kerja guru, dari merancang pembelajaran sampai mengevaluasi keterlaksanaannya di kelas. (Artefak yang sama dibahas dari sisi emosional di halaman PSE.)", bagian: "Sintaks PjBL: kelompok heterogen, guru berkeliling membimbing siswa kategori Perlu Bimbingan, siswa Mahir menjadi tutor sebaya, lalu simulasi 3D Verify dan presentasi file hasil."},
       {k: "video", alasan: "Bukti usaha saya melayani siswa dengan kecepatan belajar berbeda di laboratorium. (Dibahas dari sisi kecemasan siswa di halaman PSE.)", bagian: "Panduan step-by-step dan troubleshooting: cara membuat gambar dan memeriksa kesalahan program sendiri agar siswa tidak panik."}]},
{id: "pk", pert: "Pertemuan XI", nama: "Projek Kepemimpinan", pendek: "Projek Kepemimpinan", lk: "dokumen/lk2/LK2-Projek-Kepemimpinan.pdf",
 ringkas: "Pelatihan pengelasan SMAW untuk Karang Taruna Desa Kalisampurno.",
 connection: "Mata kuliah ini memperluas peran guru vokasi ke luar sekolah. Saya merancang dan memimpin projek Peningkatan Jiwa Entrepreneurship Pemuda Karang Taruna Desa Kalisampurno melalui Pelatihan Teknik Pengelasan SMAW. Projek ini memakai keahlian pengelasan sebagai dasar pemberdayaan dan kewirausahaan pemuda desa, dengan pendekatan kepemimpinan melayani (servant leadership).",
 challenge: "Sebelumnya saya memahami kepemimpinan guru sebatas mengelola kelas. Di sini saya belajar Design Thinking, pemetaan pemangku kepentingan, dan Work Breakdown Structure (WBS). Kesulitannya ada pada koordinasi tim, penyusunan alur pelatihan SMAW yang aman bagi pemula, dan komunikasi dengan pihak desa, pengurus Karang Taruna, dan mitra supaya projek dapat berlanjut.",
 concept: [["Prakarsa perubahan dan Design Thinking", "Menemukan masalah di desa, misalnya usia produktif yang belum punya keterampilan kerja, lalu merancang pelatihan SMAW yang bernilai ekonomis."], ["Manajemen projek", "Pemetaan sumber daya (alat las SMAW dan APD), pembagian tugas dengan WBS, alokasi waktu pelatihan, dan evaluasi hasil las."], ["Kepemimpinan melayani", "Guru sebagai fasilitator yang mendorong kemandirian dan semangat berwirausaha."]],
 change: ["Memandang diri sebagai agen perubahan yang peka terhadap kebutuhan sosial dan ekonomi sekitar, bukan hanya pengajar materi kejuruan.", "Terus memprakarsai pengabdian masyarakat berbasis keahlian vokasi dan menanamkan nilai kewirausahaan kepada siswa dan masyarakat."],
 art: [{k: "proposal", alasan: "Bukti kemampuan menganalisis kebutuhan pemuda Karang Taruna dan menyusun strategi pelatihan berbasis kewirausahaan secara sistematis.", bagian: "Latar belakang dan matriks WBS: alasan keterampilan las SMAW membuka peluang usaha di desa, serta pembagian kerja tim."},
       {k: "laporanPK", alasan: "Bukti bahwa pelatihan benar-benar terlaksana di lapangan, termasuk hasil karya peserta dan evaluasi projek.", bagian: "Evaluasi dampak dan output produk pelatihan: motivasi berwirausaha dan penguasaan teknik dasar SMAW pada peserta."}]}
];

function render(){var P=location.hash.slice(1)||'index';if(P!='artefak'&&!MK.some(function(x){return x.id==P}))P='index';var app=document.getElementById('app');

function tag(c,t){return'<span class="chip '+c+'">'+t+'</span>'}

function used(k){return MK.filter(function(m){return m.art.some(function(a){return a.k==k})})}
function home(){
var h='<section class="hero"><div class="wrap split"><div><p class="mono">LEMBAR KERJA 2 · SEMESTER II</p><h1>Refleksi Pengalaman Belajar Calon Guru Teknik Mesin</h1><p class="lead">'+PROFIL.nama+' · NIM '+PROFIL.nim+'<br>'+PROFIL.prodi+'<br>'+PROFIL.kampus+'</p><p class="small">'+PROFIL.tugas+'</p><a class="btn pri" href="#index" onclick="document.getElementById(\'mk\').scrollIntoView({behavior:\'smooth\'});return false">Lihat refleksi</a> <a class="btn" href="#artefak">Pusat artefak</a></div><img class="ill" src="'+IMG.hero+'" alt="Ilustrasi roda gigi dan pahat pemesinan pada gambar teknik"></div></section><main class="wrap">';
h+='<section><h2>Tentang portofolio ini</h2><p>Portofolio memuat refleksi dari lima mata kuliah, masing-masing dengan kerangka 4C (Connection, Challenge, Concept, Change) dan analisis artefak yang menjadi bukti. Konteks praktiknya: '+PROFIL.konteks+'</p></section>';
h+='<section><h2 id="mk">Alur mata kuliah</h2><ol class="tl">'+MK.map(function(m){return'<li class="'+(m.kosong?'off':'')+'"><img class="th" src="'+IMG[m.id]+'" alt=""><div><span class="mono">'+m.pert+'</span><h3><a href="#'+m.id+'">'+m.nama+'</a></h3><p>'+m.ringkas+'</p></div></li>'}).join('')+'</ol></section>';
h+='<section><h2>Benang merah</h2><div class="grid"><div class="card"><h3>Keselamatan dan etika kerja</h3><p>Etika, PSE, dan Projek Kepemimpinan sama-sama menuntut K3 dijalankan sebagai kebiasaan yang diteladankan guru.</p></div><div class="card"><h3>Menyesuaikan tempo siswa</h3><p>PSE dan PPL Mandiri bertemu pada satu praktik: tutorial bertahap Mastercam X5 untuk siswa yang belajar lebih lambat.</p></div><div class="card"><h3>Dari kelas ke masyarakat</h3><p>PMA mengubah cara saya menilai; Projek Kepemimpinan membawa keahlian las ke pemuda desa.</p></div></div></section>';
return h+'</main>'}

if(true){
h+='<section class="dwg"><div>'+tag('o','CONNECTION')+'<p>'+m.connection+'</p></div><div>'+tag('','CHALLENGE')+'<p>'+m.challenge+'</p></div></section>';
h+='<section class="dwg one"><div>'+tag('o','CONCEPT')+'<div class="grid">'+m.concept.map(function(c){return'<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>'}).join('')+'</div></div></section>';

var tn=(typeof IMG!='undefined'&&IMG['art_'+a.k])||('img/art/'+a.k+'.jpg'),has=!/^(studiKasus|matriksAksi|modulPMA|proposal|laporanPK)$/.test(a.k);return'<article class="card art">'+(has?'<img class="cover" src="'+tn+'" alt="">':'')+'<p class="mono">'+r.asal+'</p><h3>'+r.nama+'</h3><p class="files">'+r.berkas.map(fl).join(' ')+'</p><dl><dt>Alasan dipilih</dt><dd>'+a.alasan+'</dd><dt>Bagian pendukung</dt><dd>'+a.bagian+'</dd></dl>'+(o.length?'<p class="small">Juga dipakai di: '+o.join(', ')+'</p>':'')+'</article>'}).join('')+'</div></section>'}
